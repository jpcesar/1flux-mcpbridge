[package]
name = "bridge-core"
version = "1.0.0"
edition = "2021"
description = "Bridge local entre clientes MCP (HTTP ou stdio) e o 1fluxo aberto no browser (WebSocket)."
license = "FSL-1.1-MIT"
publish = false

[lib]
name = "bridge_core"

[[bin]]
name = "1fluxo-bridge-headless"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.26"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

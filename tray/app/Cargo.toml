[package]
name = "fluxo-bridge-app"
version = "1.1.0"
edition = "2021"
description = "App de tray do bridge 1fluxo: ON/OFF, estado e endereço MCP local."
license = "FSL-1.1-MIT"
publish = false

[[bin]]
name = "1fluxo-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../crates/bridge-core" }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png", "compression"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }

# macOS 13+: item de início pelo SMAppService. No Windows continua o plugin (chave Run).
[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"

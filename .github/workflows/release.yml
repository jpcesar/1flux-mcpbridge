name: release

# Ao criar uma tag `vX.Y.Z` compila a app de tray em macOS e Windows, junta os
# pacotes (DMG e zip no macOS, zip no Windows) e o SHA256SUMS numa Release e atesta a origem dos ficheiros (quem os
# descarrega pode confirmar que saíram deste repo e deste workflow).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tray
    env:
      # Assinatura e notarização macOS: só com os segredos definidos (ver README,
      # «Assinatura»). Sem eles a release sai com assinatura ad-hoc e um aviso.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tray
      - name: A tag tem de bater com a versão
        shell: bash
        run: |
          version="$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME ≠ versão v$version"; exit 1; }
      - name: Testes
        run: cargo test --workspace
      - name: Certificado Developer ID e chave da notarização
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Keychain temporário só para este job; o runner é descartado no fim.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Sem assinatura Developer ID
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING != 'true'
        run: echo "::warning::Release macOS sem assinatura Developer ID nem notarização — o Gatekeeper vai bloquear."
      - name: Pacote macOS
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_MACOS_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/pack-macos.sh
      - name: Pacote Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p fluxo-bridge-app
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/1fluxo-bridge.exe -DestinationPath dist/1fluxo-bridge-windows.zip
      - name: Verificar o DMG
        if: runner.os == 'macOS'
        run: scripts/check-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ runner.os }}
          path: |
            tray/dist/*.zip
            tray/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum *.zip *.dmg > SHA256SUMS && cat SHA256SUMS
      # Os atestados só funcionam em repos públicos (ou no GitHub Enterprise).
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
